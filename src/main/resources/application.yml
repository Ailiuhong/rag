server:
  port: 8989
  servlet:
    encoding:
      charset: UTF-8
      force: true  # 关键：强制使用 UTF-8，覆盖默认行为
      force-request: true
      force-response: true

spring:
  config:
    # 从项目根目录加载私密配置（阿里云 AccessKey / 模型 API Key），文件不存在时跳过
    import: optional:file:./config/secrets.yml
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  profiles:
    active: dev
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  http:
    encoding:
      charset: UTF-8
      force: true
  ai:
    websearch:
      api-key:  ${kinghy.ai.websearch.api-key}
      searxng:
        url: "http://127.0.0.1:8080/search"
        nums: 10
        engines: "duckduckgo,google,bing,brave,mojeek,presearch,qwant,startpage,yahoo,arxiv,crossref,google_scholar,internetarchivescholar,semantic_scholar"
    dashscope:
      api-key: ${kinghy.dashscope.api-key:}
      rerank:
        options:
          model: qwen3.7-text-rerank

    vectorstore:
      pgvector:
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      dimensions: 1536
  datasource:
    username: postgres
    password: 123456
    url: jdbc:postgresql://localhost:5432/postgres
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      port: 6379              # Redis 服务器端口，默认为 6379
#      password:               # Redis 密码，默认为空
      timeout: 5000ms         # 连接超时时间
      lettuce:
        pool:
          max-active: 8       # 最大连接数
          max-idle: 4         # 最大空闲连接数
          min-idle: 1         # 最小空闲连接数
          max-wait: 2000ms
aliyun:
  alioss:
    endpoint: ${kinghy.alioss.endpoint}
    access-key-id: ${kinghy.alioss.access-key-id}
    access-key-secret: ${kinghy.alioss.access-key-secret}
    bucket-name: ${kinghy.alioss.bucket-name}

kinghy:
  ai:
    # 默认对话模型，走 DashScope 的 OpenAI 兼容模式
    # （原生接口不认识 qwen3.8-27b 这类新模型，会返回 url error）
    compatible-model: qwen3.8-27b
    # 需要走 DashScope 原生接口的模型，多个用逗号分隔；留空表示全部走兼容模式
    native-models:

# Swagger UI: http://localhost:8989/swagger-ui/index.html
springdoc:
  swagger-ui:
    # 打开接口页就能直接点 Try it out，不用每次手改地址栏参数
    tryItOutEnabled: true
    operationsSorter: method
    tagsSorter: alpha
